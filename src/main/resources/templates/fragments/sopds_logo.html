<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="logo">
    <div class="show-for-medium medium-4 large-3 column" style="padding:0;">
        <img th:src="@{/images/sopds_logo.gif}">
    </div>

    <div class="small-12 medium-8 large-9 column" style="padding:0;">
        <form method="get" th:action="@{/search/books}" id="searchform" data-abide>
            <div class="input-group">
                <input class="input-group-field" type="search" name="searchterms" placeholder="Search"
                       id="main_searchbox" data-validator="check_search" required
                       th:value="${searchterms}">

                <div class="input-group-button">
                    <button class="button" type="submit" data-close="search-dropdown" name="submit">Поиск</button>
                </div>

                <div class="input-group-button">
                    <a class="dropdown button arrow-only float-right" data-toggle="search-dropdown"></a>
                </div>
                <input type="hidden" name="page" value="1">
            </div>

            <div class="dropdown-pane bottom" id="search-dropdown" data-dropdown>
                <div class="row">
                    <fieldset class="large-12 columns">
                        <legend>Тип поиска:</legend>
                        <input type="radio" name="searchtype" value="m" id="title" onclick="SetSearch()"
                               th:checked="${searchobject == null or searchobject == 'title'}">
                        <label for="title">Название</label>
                        <input type="radio" name="searchtype" value="m" id="author" onclick="SetSearch()"
                               th:checked="${searchobject == 'author'}">
                        <label for="author">Автор</label>
                        <input type="radio" name="searchtype" value="m" id="series" onclick="SetSearch()"
                               th:checked="${searchobject == 'series'}">
                        <label for="series">Серия</label>
                    </fieldset>
                </div>
            </div>
        </form>
    </div>

    <script th:inline="javascript">
        function SetSearch() {
            var searchtype = $("input[name='searchtype']:radio:checked").attr("id");
            $('#main_searchbox').attr("placeholder", "Поиск по " + searchtype);
            if (searchtype == "title") $('#searchform').attr("action", /*[[@{/search/books}]]*/ "/search/books");
            if (searchtype == "author") $('#searchform').attr("action", /*[[@{/search/authors}]]*/ "/search/authors");
            if (searchtype == "series") $('#searchform').attr("action", /*[[@{/search/series}]]*/ "/search/series");
            $('#search-dropdown').foundation('close');
        }
    </script>
</th:block>
</body>
</html>
