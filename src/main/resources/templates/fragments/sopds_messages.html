<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="messages">
    <div th:if="${systemMessage != null}" class="callout" th:classappend="${systemMessage.type}" data-closable>
        <span th:text="${systemMessage.text}">Message</span>
        <button class="close-button" aria-label="Dismiss alert" type="button" data-close>
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
</th:block>
</body>
</html>
