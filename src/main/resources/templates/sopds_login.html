<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{sopds_main :: layout(~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="panel">
        <h3>Вход в систему</h3>

        <div th:if="${param.error}" class="alert-box alert radius">
            Неверное имя пользователя или пароль
        </div>

        <div th:if="${param.logout}" class="alert-box success radius">
            Вы вышли из системы
        </div>

        <form method="post" th:action="@{/login}">
            <div class="row">
                <div class="large-4 columns">
                    <label>Имя пользователя
                        <input type="text" name="username" placeholder="Имя пользователя" autofocus>
                    </label>
                    <label>Пароль
                        <input type="password" name="password" placeholder="Пароль">
                    </label>
                    <button type="submit" class="button">Войти</button>
                </div>
            </div>
        </form>
    </div>
</th:block>
</body>
</html>
