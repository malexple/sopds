<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{sopds_main :: layout(~{::content})}">
<body>
<th:block th:fragment="content">
    <table>
        <tr th:each="g : ${items}">
            <td>
                <!-- Секции (верхний уровень) -->
                <a th:if="${parentId == null or parentId == 0}" th:href="@{/genre(section=${g.sectionId})}" th:text="${g.section}">Section</a>
                <!-- Подсекции -->
                <a th:if="${parentId != null and parentId > 0}" th:href="@{/search/books(searchtype=g,searchterms=${g.id})}" th:text="${g.subsection}">Subsection</a>
                <span style="font-size:80%" th:text="'Всего: ' + ${g.numBook} + ' книг.'">Всего: 0 книг.</span>
            </td>
        </tr>
    </table>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(items)}" class="callout">
        <p>Жанры не найдены</p>
    </div>
</th:block>
</body>
</html>
