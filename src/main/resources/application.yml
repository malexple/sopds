spring:
  application:
    name: sopds

  datasource:
    url: jdbc:sqlite:${user.home}/sopds/sopds.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: com.sopds.config.SopdsQLiteDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/sqlite
    baseline-on-migrate: true
    validate-on-migrate: true

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  security:
    user:
      name: admin
      password: admin

server:
  port: 8080

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.sopds.api
  paths-to-match: /api/**

logging:
  level:
    root: INFO
    com.sopds: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG

sopds:
  root-lib: d:\books
  book-extensions: fb2,epub,mobi,pdf,djvu,doc,docx,rtf,txt
  scan-on-startup: true
  max-items: 60

