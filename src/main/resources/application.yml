spring:
  application:
    name: sopds
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
    open-in-view: false
  datasource:
    url: jdbc:postgresql://localhost:5439/sopds2
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
  security:
    user:
      name: admin
      password: admin

server:
  port: 8080

# OpenAPI / Swagger
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.sopds.api
  paths-to-match: /api/**

logging:
  level:
    root: INFO
    com.sopds: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG

sopds:
  root-lib: d:\projects\java\sopds\books\
  book-extensions: fb2,epub,mobi,pdf,djvu,doc,docx,rtf,txt
  scan-on-startup: true
  max-items: 60

